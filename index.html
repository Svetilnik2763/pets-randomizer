<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Генератор Существ </title>
    <style>
    	
        body {
            background-color: #2D2B28;
            color: #fff;
            font-family: "Rubik", sans-serif;
            font-optical-sizing: auto;
            text-align: center;
            padding-top: 50px;
        }

        .card {
            background: #4C463A;
            border: 4px solid #C4BB84; 
            padding: 20px;
            display: inline-block;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 0 #1e1e24; 
        }

        img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border: 3px solid #C4BB84;
            border-radius: 8px;
            background-color: #575766;
        }

        .result-text {
            font-size: 18px;
            margin: 20px 0;
            line-height: 1.6;
            color: #ffeb3b; 
        }

        button {
            background-color: #C4BB84;
            color: white;
            border: 1px solid #FFFFD6;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #7F8000;
            font-weight: bold;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
       
        }
        p{
        	font-size: 30px;
        	border: 3px solid #C4BB84;
        }
        #aaa{
        	width: 100%;
            max-width: 100px;
            height: auto;
            border: 1px solid #C4BB84;
            border-radius: 8px;
            background-color: #575766;
            box-shadow: 0 10px 0 #000;
        }

    </style>
</head>
<body>

    <h1>Генератор Питомцев</h1>

    <div class="card">
       
        <img id="animal-img" src="hoshi.jpg" alt="Существо"><br>
        

        <div id="result" class="result-text">
            Нажми на кнопку, чтобы создать существо!
        </div>
        
        <!-- При клике запускается функция-->
        <button onclick="generate();">Сгенерировать</button>
    </div>

    <div>
    	<p>сладких снов рыбка❤</p>
    	<img id="aaa" src="riba.jpg" alt="Существо">
    </div>

   
    <script>
        const animals = ["Кот", "Собака", "Рыбка Бетта", "Пискун", "Кролик", "Попугай", "Кастрюля", "Ляпись", "Змея", "Пингвин", "Ёжик", "Хошипон", "Тигрикс"];
        const character = ["Спокойный(ая)", "СДВГ", "Злой(ая)", "Ленивый(ая)", "Дипрессивный(ая)", "Сумашедший(ая)", "Радостный(ая)", "Немой(ая)", "Еле живой(ая)"];
        const ages = ["3 года", "5 лет", "10 лет", "99 лет", "вчера", "скрывает", "12 лет", "1 годик", "25 лет"];
        const hobbies = [
            "любит рисовать пяткой", 
            "любит танцевать дипрессивный флешмоб", 
            "любит спать под водой", 
            "любит воровать у тебя вещи",
            "любит смотреть аниме",
            "любит покушат, много",
            "любит ломать вещи",
            "ничего не любит и призерает тебя",
            "любит обнимашке",
            "любит играть в компьютерные игры. В будущем станет киберспортсменом",
            "любит человеческую плоть",
            "любит гулять на поводке",
            "любит читать комексы по Светлайтерам потомучто они лучшие"
        ];

        function getRandomElement(array) {
            const randomIndex = Math.floor(Math.random() * array.length);
            return array[randomIndex];
        }

        function generate() {
  
            const chosenAnimal = getRandomElement(animals);
            const chosenColor = getRandomElement(character); 
            const chosenAge = getRandomElement(ages);
            const chosenHobby = getRandomElement(hobbies);

            
            let imgFile = "";
            if (chosenAnimal === "Кот") {
                imgFile = "cat.jpg";
            } else if (chosenAnimal === "Собака") {
                imgFile = "dog.jpg";
            } else if (chosenAnimal === "Пискун") {
                imgFile = "peeper1.jpg";
            } else if (chosenAnimal === "Кролик") {
                imgFile = "rabbit.jpg";
            } else if (chosenAnimal === "Попугай") {
                imgFile = "parrot.jpg";
            } else if (chosenAnimal === "Кастрюля") {
                imgFile = "costrulya.jpg";
            } else if (chosenAnimal === "Ляпись") {
                imgFile = "lyapis.jpg"; 
            } else if (chosenAnimal === "Змея") {
                imgFile = "python.png";  
            } else if (chosenAnimal === "Пингвин") {
                imgFile = "penquin.jpg";   
            } else if (chosenAnimal === "Ёжик") {
                imgFile = "sonic.jpg";      
            } else if (chosenAnimal === "Хошипон") {
                imgFile = "hoshi.jpg";   
            } else if (chosenAnimal === "Тигрикс") {   
                imgFile = "tigra.png";                        
            } else {
                imgFile = "bettafish.jpg";
            }

            
            const textBlock = document.getElementById("result");
            const imgBlock = document.getElementById("animal-img");

            
            if (textBlock && imgBlock) {
                textBlock.innerHTML = `Это ${chosenColor} ${chosenAnimal} <br> 
                                       Возраст: ${chosenAge}. <br> 
                                       И оно ${chosenHobby}`;
                imgBlock.src = imgFile;
            }
        }

        // Запускаем первый раз при старте
        window.onload = function() {
            generate();
        };
    </script>

</body>
</html>
